<!-- ROW 2: Secondary Telemetry Buttons -->

</div>

            <!-- ROW 1: Inspect + Main Action (ACTIVATE) -->

                <!-- 1. Inspect (Visual loop mode: Front/Back/Raw) -->

                <!-- 2. Main Action (ACTIVATE) -->
                <button onclick="adquirirNodo()" class="h-[42px] col-span-5 w-full bg-white/10 backdrop-blur-md text-white font-black text-[10px] sm:text-[11px] tracking-[0.3em] uppercase rounded-sm border border-white/20 hover:border-sky-500/50 hover:bg-sky-500/10 transition-all duration-300 flex items-center justify-center active:scale-[0.99]">
                    ACTIVAR

            </div>

            <!-- Techno-Ecological Selector (Prev Arrow + Label & Price + Next Arrow) -->
            <div class="flex items-center justify-between text-white/50 text-[8px] tracking-[0.25em] font-mono select-none w-full uppercase pt-1">
                
                <!-- Left Arrow (Previous Variant) -->
                <button id="btn-prev-variant" title="Variante Anterior" onclick="rotarBioVariant('prev')" class="p-1 hover:text-sky-400 text-sky-400/70 transition-colors active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">

                    <span id="biorush-label">PULSOR FOCUS</span>

                    <span id="biorush-price">$70.000</span>

                <!-- Right Arrow (Next Variant) -->
                <button id="btn-next-variant" title="Variante Siguiente" onclick="rotarBioVariant('next')" class="p-1 hover:text-sky-400 text-sky-400/70 transition-colors active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </button>

            </div>

        </section>

        <!-- FOOTER -->
        <footer class="h-[50px] shrink-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent backdrop-blur-sm z-50 flex items-center justify-center">
            <span class="text-[6px] tracking-[0.5em] font-bold text-white/30 uppercase">
                BIORUSH © 2026
            </span>
        </footer>

    </main>

<script>
    // =========================================================================
    // 1. COMMERCIAL CATALOG CONFIGURATION
    // =========================================================================
    const BIORUSH_CATALOG = {
        'PULSOR': {
            defaultVariant: 'FOCUS',
            variants: {
                'FOCUS': { 
                    label: 'PULSOR FOCUS', desc: 'Enfoque y claridad cognitiva', 
                    spec: 'LION’S MANE', cant:  '44X500MGRS', price: '$70.000', id: 'PULS44F',
                    img: 'img/44caps.png', imgBack: 'img/44mane.png', imgRaw: 'img/maneRaw.png',
                    telemetry: { COL: '24°', FRU: '18°', SEC: '40°', MOL: '98.2%' },
                    benefits: ['NEUROGÉNESIS', 'CLARIDAD COGNITIVA', 'MEMORIA FLUIDA', 'NIEBLA  (-)', 'OPTIMIZACIÓN SINÁPTICA', 'ENFOQUE PROFUNDO', 'AGUDEZA ', 'REPARACIÓN NEURONAL', 'ENFOQUE', 'PRODUCTIVIDAD SOSTENIDA']
                },
                'ZEN': { 
                    label: 'PULSOR ZEN', desc: 'Silencio mental óptimo', 
                    spec: 'REISHI', cant:  '44X500MGRS', price: '$70.000', id: 'PULS44Z',
                    img: 'img/44caps.png', imgBack: 'img/44reishi.png', imgRaw: 'img/reishiRaw.png',
                    telemetry: { COL: '22°', FRU: '16°', SEC: '38°', MOL: '97.5' },
                    benefits: ['REDUCCIÓN CORTISOL', 'CALMA PROFUNDA', 'REGULACIÓN NERVIOSA', 'DESCANSO REPARADOR', 'EQUILIBRIO ', 'ADAPTACIÓN AL ESTRÉS', 'PAZ COGNITIVA', 'SUEÑO LÚCIDO', 'RELAJACIÓN MUSCULAR', 'CLARIDAD INTERNA']
                },
                'STAMINA': { 
                    label: 'PULSOR STAMINA', desc: 'Potencia celular óptima', 
                    spec: 'CORDYCEPS', cant:  '44X500MGRS', price: '$70.000', id: 'PULS44S',
                    img: 'img/44caps.png', imgBack: 'img/44cordy.png', imgRaw: 'img/cordyRaw.png',
                    telemetry: { COL: '20°', FRU: '15°', SEC: '42°', MOL: '99.0' },
                    benefits: ['POTENCIA AERÓBICA', 'ENERGÍA CELULAR (ATP)', 'RESISTENCIA FÍSICA', 'OXIGENACIÓN SANGUÍNEA', 'RECUPERACIÓN RÁPIDA', 'VITALIDAD GENERAL', 'RENDIMIENTO ATLÉTICO', 'FUNCIÓN RESPIRATORIA', 'METABOLISMO ACTIVO', 'FATIGA (-)']
                },
                'CORE': { 
                    label: 'PULSOR CORE', desc: 'Respuesta inmune óptima', 
                    spec: 'TURKEY TAIL', cant:  '44X500MGRS', price: '$70.000', id: 'PULS44C',
                    img: 'img/44caps.png', imgBack: 'img/44turkey.png', imgRaw: 'img/turkeyRaw.png',
                    telemetry: { COL: '23°', FRU: '19°', SEC: '40°', MOL: '98.5' },
                    benefits: ['RESPUESTA INMUNE', 'BIOMA INTESTINAL', 'DEFENSA CELULAR', 'ANTIOXIDANTE', 'SALUD DIGESTIVA', 'PROTECCIÓN SISTÉMICA', 'REDUCCIÓN INFLAMACIÓN', 'ESTABILIDAD INTERNA', 'SÍNTESIS NUTRITIVA', 'FORTALEZA INTEGRAL']
                }
            }
        }
    };

    let currentBioItem = 'PULSOR';
    let currentBioVariant = 'FOCUS';
    const numeroCelular = "573025333130";
    let currentSphereIdx = "0000";
    let activeNodeVal = "0000";

    // ==========================================
    // 2. UI ELEMENTS CACHE (OPTIMIZED)
    // ==========================================
    const $ = (id) => document.getElementById(id);
    const cachedElements = {};
    
    function getCachedEl(id) {
        if (!cachedElements[id]) {
            cachedElements[id] = $(id);
        }
        return cachedElements[id];
    }

    const triggerHaptic = (ms) => { if (navigator.vibrate) navigator.vibrate(ms); };

// ==========================================
    // 3. VISUAL STATE ENGINE (3-State Loop Sequence)
    // ==========================================
    let indiceModoInspector = 0; // Estado global para mantener sincronía del inspeccionador

    function aplicarModoVisual(modo) {
        const front = getCachedEl('biorush-pack-img');
        const back = getCachedEl('biorush-pack-img-back');
        const raw = getCachedEl('biorush-pack-img-raw');
        const svg = getCachedEl('laser-vector-target');

        // Reset general opacity
        [front, back, raw].forEach(el => { if(el) el.style.opacity = '0'; });
        
        // Apply active state
        if (modo === 'front') {
            front.style.opacity = '1';
            front.style.zIndex = '10';
            back.style.zIndex = '0';
            if (svg) { svg.style.opacity = '1'; svg.style.pointerEvents = 'auto'; }
        } else if (modo === 'back') {
            back.style.opacity = '1';
            back.style.zIndex = '10';
            front.style.zIndex = '0';
            if (svg) { svg.style.opacity = '0'; svg.style.pointerEvents = 'none'; }
        } else if (modo === 'raw') {
            raw.style.opacity = '1';
            if (svg) { svg.style.opacity = '0'; svg.style.pointerEvents = 'none'; }
        }
    }

    function vincularBotones() {
        const btnBio = getCachedEl('btn-reveal-bio');
        const panelTelemetry = getCachedEl('panel-telemetry-data');
        const defaultText = "ONDAS BIOCINÉTICAS REGENERATIVAS";
        const modos = ['front', 'back', 'raw'];

        if (btnBio) {
            btnBio.addEventListener('click', () => {
                // Avanzar cíclicamente: 0 (front) -> 1 (back) -> 2 (raw) -> 0 (front)
                indiceModoInspector = (indiceModoInspector + 1) % modos.length;
                const modoActual = modos[indiceModoInspector];
                
                // Aplicar renderizado visual
                aplicarModoVisual(modoActual);
                
                // Actualizar texto en panel-telemetry-data según el diccionario activo
                if (panelTelemetry) {
                    const variantConfig = BIORUSH_CATALOG[currentBioItem].variants[currentBioVariant];
                    
                    if (modoActual === 'back') {
                        panelTelemetry.textContent = variantConfig.spec.toUpperCase();
                    } else if (modoActual === 'raw') {
                        panelTelemetry.textContent = variantConfig.cant.toUpperCase();
                    } else {
                        panelTelemetry.textContent = defaultText;
                    }
                }

                triggerHaptic(12);
            });
        }
    }
    
    // ==========================================
    // 4. USER INTERFACE CONTROLLERS
    // ==========================================
    function inicializarBioRush() {
        const menuContainer = getCachedEl('biorush-items-menu');
        if (menuContainer) {
            menuContainer.innerHTML = Object.keys(BIORUSH_CATALOG).map(item => `
                <span id="menu-bio-${item}" onclick="cambiarBioItem('${item}')" class="cursor-pointer tracking-[0.15em] transition-all duration-300 h-5 leading-none font-bold">
                    ${item}
                </span>
            `).join('');
        }
        
        vincularBotones();
        actualizarBioUI();
    }

    function cambiarBioItem(itemKey) {
        currentBioItem = itemKey;
        currentBioVariant = BIORUSH_CATALOG[itemKey].defaultVariant;
        actualizarBioUI();
        triggerHaptic(15);
    }

    // ==========================================
    // VARIANT ROTATION AND UPDATE (BIDIRECTIONAL LOOP)
    // ==========================================
    function rotarBioVariant(direction = 'next') {
        const itemConfig = BIORUSH_CATALOG[currentBioItem];
        const variantsKeys = Object.keys(itemConfig.variants);
        const currentIndex = variantsKeys.indexOf(currentBioVariant);
        
        let nextIndex;
        if (direction === 'next') {
            nextIndex = (currentIndex + 1) % variantsKeys.length;
        } else {
            nextIndex = (currentIndex - 1 + variantsKeys.length) % variantsKeys.length;
        }
        
        currentBioVariant = variantsKeys[nextIndex];
        
        actualizarBioUI();
        triggerHaptic(12);
    }

function actualizarBioUI() {
    const itemConfig = BIORUSH_CATALOG[currentBioItem];
    const variantConfig = itemConfig.variants[currentBioVariant];
    
    const descEl = getCachedEl('biorush-description');
    const packImg = getCachedEl('biorush-pack-img');
    const packImgBack = getCachedEl('biorush-pack-img-back');
    const panelTelemetry = getCachedEl('panel-telemetry-data');
    
    if (descEl && packImg && packImgBack) {
        descEl.classList.add('opacity-0');
        
        setTimeout(() => {
            descEl.textContent = variantConfig.desc;
            packImg.src = variantConfig.img;
            packImgBack.src = variantConfig.imgBack;
            getCachedEl('biorush-pack-img-raw').src = variantConfig.imgRaw;
            
            const labelTitle = getCachedEl('laser-variant-title');
            if (labelTitle) labelTitle.textContent = variantConfig.label;
            
            if (getCachedEl('biorush-label')) getCachedEl('biorush-label').textContent = variantConfig.label;
            getCachedEl('biorush-price').textContent = variantConfig.price;
            
            // Sincroniza la telemetría según el modo de imagen visible
            if (panelTelemetry) {
                const backImg = getCachedEl('biorush-pack-img-back');
                const rawImg = getCachedEl('biorush-pack-img-raw');
                
                if (backImg && backImg.style.opacity === '1') {
                    panelTelemetry.textContent = variantConfig.spec.toUpperCase();
                } else if (rawImg && rawImg.style.opacity === '1') {
                    panelTelemetry.textContent = variantConfig.cant.toUpperCase();
                }
            }

            descEl.classList.remove('opacity-0');
        }, 120);
    }
}

    // =========================================================================
    // 5. TELEMETRY ENGINE (PULS PROTOCOL)
    // =========================================================================
    function calculateSphereIndex() {
        const now = new Date();
        const epoch = new Date('2012-12-21T00:00:00Z');
        const daysSinceEpoch = Math.floor((now - epoch) / 86400000);
        
        const currentHour = now.getHours();
        const sphereQuadrant = Math.floor(currentHour / 6);
        const totalSpheres = (daysSinceEpoch * 4) + sphereQuadrant;
        
        return `${String(totalSpheres).padStart(4, '0')}`;
    }

    function updateZ() {
        let biokineticCoordinate = "";
        const now = new Date();
        const hours = now.getHours(); 
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();

        // Update global Sphere variable
        currentSphereIdx = calculateSphereIndex();

        let setsStage = 1;  
        let repsStage = 1;  
        let currentAction = 'P'; 

        if (seconds % 2 !== 0) {
            const progress1s = now.getMilliseconds() / 1000; 
            setsStage = Math.floor(progress1s * 12) + 1;
            repsStage = 13 - setsStage; 

            if (progress1s < 0.25) currentAction = 'P';
            else if (progress1s < 0.5) currentAction = 'U';
            else if (progress1s < 0.75) currentAction = 'L';
            else currentAction = 'S';
        } else {
            setsStage = Math.floor((minutes % 12) + 1);
            
            if (seconds < 30) {
                const subSlot = Math.floor((seconds % 30) / 7.5);
                currentAction = ["PL", "PU", "LU", "SU"][subSlot] || "PL";
                repsStage = Math.floor((seconds % 10) + 2);
            } else {
                const subSlot = Math.floor(((seconds - 30) % 30) / 7.5);
                currentAction = ["PUL", "PLS", "LUP", "ULS"][subSlot] || "ULS";
                repsStage = Math.floor(((seconds - 30) % 10) + 3);
            }
        }
        setsStage = Math.max(1, Math.min(12, setsStage));
        repsStage = Math.max(1, Math.min(12, repsStage));
        biokineticCoordinate = `${setsStage}${currentAction}${repsStage}`;

        // Simultaneous DIAL update on package and bottom bar
        const elDialPack = getCachedEl('z-dial-pack');
        const elDialTele = getCachedEl('z-dial-telemetry');

        if (elDialPack) elDialPack.textContent = biokineticCoordinate;
        if (elDialTele) elDialTele.textContent = biokineticCoordinate;
                
        // Update global Node variable
        const totalSecondsSinceMidnight = (hours * 3600) + (minutes * 60) + seconds;
        activeNodeVal = `${String(totalSecondsSinceMidnight + 1).padStart(4, '0')}`;

        const subSetsSolar = getCachedEl('sub-sets-solar');
        const subRepsTension = getCachedEl('sub-reps-tension');
        if (subSetsSolar) subSetsSolar.textContent = `${(0.05 + (setsStage / 240)).toFixed(3)}`;
        if (subRepsTension) subRepsTension.textContent = `${(14.2 + (repsStage * 0.8)).toFixed(1)}`;
    }

    // =========================================================================
    // 5. TELEMETRY ENGINE & TELEMETRY BUTTONS
    // =========================================================================
    const TELEMETRY_CONFIG = {
        'btn-tele-hz': {
            meaning: "Frecuencia de resonancia",
            targetElId: 'sub-sets-solar'
        },
        'btn-tele-dial': {
            meaning: "Coordenada Biocinética Activa",
            targetElId: 'z-dial-telemetry'
        },
        'btn-tele-tension': {
            meaning: "Magnetismo gravitacional",
            targetElId: 'sub-reps-tension'
        }
    };

    function habilitarReveladoTelemetria() {
        const telemetryData = getCachedEl('panel-telemetry-data');
        const textoOriginal = "ONDAS BIOCINÉTICAS REGENERATIVAS"; 
        let ultimoBoton = null;
        let ultimoDato = null;
        let activeTimeout = null;

        Object.keys(TELEMETRY_CONFIG).forEach(btnId => {
            const btn = getCachedEl(btnId);
            if (!btn) return;

            btn.addEventListener('click', () => {
                triggerHaptic(10);

                // --- RESTAURAR LA VISTA AL EMBALAJE FRONTAL (FRONT / 44CAPS) ---
                indiceModoInspector = 0; // Resetea el índice del loop a 'front'
                aplicarModoVisual('front');

                // 1. Limpieza de estados anteriores activos si el usuario pulsa rápido
                if (activeTimeout) clearTimeout(activeTimeout);

                if (ultimoBoton) {
                    ultimoBoton.classList.remove('border-sky-500/80', 'bg-sky-500/20');
                    ultimoBoton.classList.add('border-sky-500/20', 'bg-sky-950/20');
                }
                if (ultimoDato) {
                    ultimoDato.classList.remove('text-sky-400', 'font-bold', 'scale-110');
                    ultimoDato.classList.add('text-white/70');
                }

                // 2. Resaltar Botón presionado
                btn.classList.remove('border-sky-500/20', 'bg-sky-950/20');
                btn.classList.add('border-sky-500/80', 'bg-sky-500/20');
                ultimoBoton = btn;

                // 3. Resaltar Dato Numérico correspondiente
                const targetDataEl = getCachedEl(TELEMETRY_CONFIG[btnId].targetElId);
                if (targetDataEl) {
                    targetDataEl.classList.remove('text-white/70');
                    targetDataEl.classList.add('text-sky-400', 'font-bold', 'scale-110');
                    ultimoDato = targetDataEl;
                }

                // 4. Mostrar Leyenda/Meaning
                telemetryData.innerHTML = TELEMETRY_CONFIG[btnId].meaning.toUpperCase();
                
                // 5. Temporizador para restaurar estado tras 8s
                activeTimeout = setTimeout(() => {
                    telemetryData.innerHTML = textoOriginal;
                    
                    if (ultimoBoton) {
                        ultimoBoton.classList.remove('border-sky-500/80', 'bg-sky-500/20');
                        ultimoBoton.classList.add('border-sky-500/20', 'bg-sky-950/20');
                        ultimoBoton = null;
                    }
                    if (ultimoDato) {
                        ultimoDato.classList.remove('text-sky-400', 'font-bold', 'scale-110');
                        ultimoDato.classList.add('text-white/70');
                        ultimoDato = null;
                    }
                }, 8000);
            });
        });
    }

    // =========================================================================
    // 6. PURCHASE TELEMETRY CAPTURE (PAYLOAD GENERATION)
    // =========================================================================
    function adquirirNodo() {
        const variantConfig = BIORUSH_CATALOG[currentBioItem].variants[currentBioVariant];
        const currentCoord = getCachedEl('z-dial-telemetry')?.textContent || getCachedEl('z-dial-pack')?.textContent || "N/A";
        
        // Read directly from global variables without depending on DOM
        const currentSphere = currentSphereIdx;
        const currentNode = activeNodeVal;
        
        // Capture calculated values from DOM
        const freqValue = getCachedEl('sub-sets-solar')?.textContent || "0.00 Hz";
        const tensionValue = getCachedEl('sub-reps-tension')?.textContent || "0.0 N";
        
        const dialInterpretation = currentCoord.replace(/(\d+)([A-Z]+)(\d+)/, "$1 FASES, $3 NODOS - ESTADO $2");
        
        const mensaje = `⚡ *ORDEN - BIORUSH* ⚡\n\n` +
                        `• *Vector:* ${currentBioItem} ${currentBioVariant}\n` +
                        `• *Carga:* ${variantConfig.spec}\n` +
                        `• *ID:* \`${variantConfig.id}\`\n` +
                        `• *Precio:* ${variantConfig.price}\n\n` +
                        `--- *PROTOCOLO P.U.L.S.* ---\n` +
                        `• *Matriz de Configuración:* \`${currentCoord}\`\n` +
                        `• *Análisis de Estado:* ${dialInterpretation}\n` +
                        `• *Lote:* \`${currentSphere}\`\n` +
                        `• *Saturación:* \`${currentNode}\`\n` +
                        `• *Resonancia:* \`${freqValue}\`\n` +
                        `• *Cohesión:* \`${tensionValue}\`\n\n` +
                        `• *Cantidad:* ${variantConfig.cant}\n` +
                        `Activar configuración actual.`;

        triggerHaptic([15, 40, 15]);
        window.open(`https://api.whatsapp.com/send?phone=${numeroCelular}&text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    // Coordinated DOM Lifecycle Initialization
    document.addEventListener('DOMContentLoaded', () => {
        inicializarBioRush();
        updateZ(); 
        setInterval(updateZ, 1000);
        habilitarReveladoTelemetria();
    });
</script>
</body>
</html>
